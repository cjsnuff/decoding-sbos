openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: interests
    description: Cohort interest submissions
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /interests:
    post:
      operationId: submitInterest
      tags: [interests]
      summary: Submit interest in the next cohort
      description: Notifies the facilitator and sends a confirmation email to the submitter.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InterestInput"
      responses:
        "200":
          description: Interest submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterestConfirmation"
        "400":
          description: Invalid form submission
        "429":
          description: Too many submissions
        "502":
          description: Email provider error
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    InterestInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          pattern: '^[^\s@]+@[^\s@]+\.[^\s@]+$'
          maxLength: 254
        message:
          type: string
          maxLength: 2000
        website:
          type: string
          maxLength: 200
          description: Honeypot field; must remain empty.
      required:
        - name
        - email
    InterestConfirmation:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required:
        - success
        - message

